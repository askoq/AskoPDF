name: asko_pdf
description: "Lightweight PDF Viewer"
publish_to: 'none'

version: 1.5.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ffi: ^2.1.5
  file_selector: ^1.0.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  desktop_drop: ^0.7.0
  path_provider: ^2.1.5
  pasteboard: ^0.3.0
  bitsdojo_window: ^0.1.6
  crypto: ^3.0.3
  google_fonts: ^6.2.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
